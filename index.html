<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ記録 - YUU Edition</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #2d3436; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 25px; }
        
        .label {
            font-size: 14px;
            color: #747d8c;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .selector-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .workout-selector {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccd1d9;
            font-weight: bold;
            background-color: #fff;
        }
        .btn-delete-menu {
            background-color: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .count-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 14px;
            border: 2px solid #2ed573;
            box-sizing: border-box;
            color: #2ed573;
        }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        button {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-save { background-color: #2ed573; color: white; font-size: 20px; padding: 16px; }
        .btn-export { background-color: #1e90ff; color: white; font-size: 16px; }
        
        .add-menu-box {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
        }
        .add-menu-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-new-menu { background-color: #a4b0be; color: white; padding: 10px 15px; font-size: 14px; border-radius: 8px; flex-shrink: 0; }

        .best-section {
            background: #fff9db;
            border: 1px solid #fab005;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .best-title {
            font-size: 15px;
            font-weight: bold;
            color: #f59f00;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .best-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }
        .best-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #fff3bf;
            display: flex;
            justify-content: space-between;
        }
        .best-name { color: #495057; font-weight: bold; }
        .best-val { color: #f59f00; font-weight: bold; }

        /* 💡 自己ベストの下に移動した期間＆日数カウンターのスタイル */
        .day-counter-box {
            background: #e3faf2;
            color: #0ca678;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .day-counter-title {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .day-counter-period {
            font-size: 12px;
            color: #37b24d;
            font-weight: normal;
        }

        .history-section {
            border-top: 2px solid #f1f2f6;
            padding-top: 20px;
        }
        .history-title {
            font-size: 18px;
            color: #2d3436;
            margin: 0 0 15px 0;
        }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
        }
        .history-item {
            padding: 12px 8px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-content { flex: 1; }
        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #747d8c;
            font-size: 12px;
            margin-bottom: 4px;
            padding-right: 15px;
        }
        .history-data {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            padding-right: 15px;
        }
        .menu-name { color: #2d3436; }
        .count-val { color: #2ed573; }
        .btn-item-delete {
            background: none;
            color: #a4b0be;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-item-delete:hover { color: #ff4757; }

        .signature {
            margin-top: 20px;
            font-size: 11px;
            color: #b2bec3;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 筋トレ記録 🔥</h1>
    
    <!-- 💡 最上部にきて、すぐ入力できるよう配置変更！ -->
    <span class="label">種目の選択</span>
    <div class="selector-box">
        <select class="workout-selector" id="workoutSelect"></select>
        <button class="btn-delete-menu" onclick="deleteCurrentMenu()">消去 ❌</button>
    </div>

    <div class="input-box">
        <span class="label">行った回数を入力</span>
        <input type="number" class="count-input" id="countInput" inputmode="numeric" placeholder="0" min="1">
    </div>
    
    <div class="btn-grid">
        <button class="btn-save" onclick="saveRecord()">記録する 📝</button>
        <button class="btn-export" onclick="exportHistory()">クリップボードに全コピー 📋</button>
    </div>

    <div class="add-menu-box">
        <input type="text" class="add-menu-input" id="newMenuInput" placeholder="新しい種目名を入力...">
        <button class="btn-new-menu" onclick="addNewMenu()">種目を追加</button>
    </div>

    <div class="best-section">
        <div class="best-title">🏆 自己ベスト（最高回数）</div>
        <div class="best-grid" id="bestGrid"></div>
    </div>

    <!-- 💡 ご要望通り、自己ベストの下の欄に移動！ -->
    <div class="day-counter-box" id="dayCounterBox">
        <div class="day-counter-title" id="dayCounterDisplay">現在の保存日数: 0 日間</div>
        <div class="day-counter-period" id="periodDisplay">記録がありません</div>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>📊 過去の筋トレ記録</span>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="signature">Created by YUU</div>
</div>

<script>
    const defaultMenus = ["逆手懸垂", "腕立て", "カーフレイズ", "スクワット"];
    let customMenus = JSON.parse(localStorage.getItem('pureLocalMenus')) || defaultMenus;
    let historyData = JSON.parse(localStorage.getItem('pureLocalHistory')) || [];

    let currentDiffDays = 0;
    let currentPeriodText = "記録がありません";

    initMenuSelect();
    updateAppStatus();
    renderBests();
    renderHistory();

    function initMenuSelect() {
        const select = document.getElementById('workoutSelect');
        select.innerHTML = '';
        customMenus.forEach(menu => {
            const opt = document.createElement('option');
            opt.value = menu;
            opt.innerText = menu;
            select.appendChild(opt);
        });
    }

    function updateAppStatus() {
        const counterDisplay = document.getElementById('dayCounterDisplay');
        const periodDisplay = document.getElementById('periodDisplay');
        const box = document.getElementById('dayCounterBox');

        if (historyData.length === 0) {
            counterDisplay.innerText = "現在の保存日数: 0 日間";
            periodDisplay.innerText = "記録がありません";
            currentDiffDays = 0;
            currentPeriodText = "記録がありません";
            box.style.backgroundColor = "#e3faf2";
            box.style.color = "#0ca678";
            return;
        }

        const oldestRecord = historyData[historyData.length - 1];
        const newestRecord = historyData[0];

        const start = new Date(oldestRecord.date);
        const end = new Date(newestRecord.date);
        const diffTime = Math.abs(end - start);
        currentDiffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

        const formatDateText = (dateStr) => {
            const d = new Date(dateStr);
            return `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, '0')}月${String(d.getDate()).padStart(2, '0')}日`;
        };
        
        currentPeriodText = `${formatDateText(oldestRecord.date)} 〜 ${formatDateText(newestRecord.date)}`;
        
        counterDisplay.innerText = `最初の記録から ${currentDiffDays} 日目`;
        periodDisplay.innerText = `📅 ${currentPeriodText}`;

        box.style.backgroundColor = "#e3faf2";
        box.style.color = "#0ca678";
        periodDisplay.style.color = "#37b24d";

        if (currentDiffDays >= 100) {
            box.style.backgroundColor = "#fff0f6";
            box.style.color = "#e64980";
            periodDisplay.style.color = "#f06595";
            
            if (!localStorage.getItem('alerted100DaysPure')) {
                alert(`📋 最初の記録から100日以上が経過しています！ 📋\n\nスマホ内にデータが溜まってきているので、必要に応じて「クリップボードに全コピー」をして、外部（Keepなど）へバックアップを行ってください。✨`);
                localStorage.setItem('alerted100DaysPure', 'true');
            }
        } else {
            localStorage.removeItem('alerted100DaysPure');
        }
    }

    function renderBests() {
        const grid = document.getElementById('bestGrid');
        grid.innerHTML = '';

        customMenus.forEach(menu => {
            const records = historyData.filter(item => item.menu === menu);
            const maxCount = records.length > 0 ? Math.max(...records.map(item => item.count)) : 0;

            const div = document.createElement('div');
            div.className = 'best-item';
            div.innerHTML = `
                <span class="best-name">${menu}</span>
                <span class="best-val">${maxCount}回</span>
            `;
            grid.appendChild(div);
        });
    }

    function deleteCurrentMenu() {
        const select = document.getElementById('workoutSelect');
        const currentMenu = select.value;
        if (!currentMenu) return;

        if (confirm(`種目リストから「${currentMenu}」を削除しますか？`)) {
            customMenus = customMenus.filter(m => m !== currentMenu);
            localStorage.setItem('pureLocalMenus', JSON.stringify(customMenus));
            initMenuSelect();
            renderBests();
        }
    }

    function addNewMenu() {
        const input = document.getElementById('newMenuInput');
        const menuName = input.value.trim();
        if (!menuName) return;
        if (customMenus.includes(menuName)) { alert('その種目はもうあるよ！👀'); return; }

        customMenus.push(menuName);
        localStorage.setItem('pureLocalMenus', JSON.stringify(customMenus));
        initMenuSelect();
        document.getElementById('workoutSelect').value = menuName;
        input.value = '';
        renderBests();
    }

    function saveRecord() {
        const countInput = document.getElementById('countInput');
        const countVal = parseInt(countInput.value, 10);
        if (isNaN(countVal) || countVal <= 0) { return; }

        const selectedMenu = document.getElementById('workoutSelect').value;
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newRecord = { date: dateStr, time: timeStr, menu: selectedMenu, count: countVal, id: now.getTime() };

        historyData.unshift(newRecord);
        localStorage.setItem('pureLocalHistory', JSON.stringify(historyData));
        
        countInput.value = '';
        renderHistory();
        renderBests();
        updateAppStatus();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        if (historyData.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px;">まだ記録がありません。</div>';
            return;
        }
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-content">
                    <div class="history-meta"><span>📅 ${item.date}</span><span>⏰ ${item.time}</span></div>
                    <div class="history-data"><span class="menu-name">💪 ${item.menu}</span><span class="count-val">${item.count} 回</span></div>
                </div>
                <button class="btn-item-delete" onclick="deleteHistoryItem(${item.id})">🗑️</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteHistoryItem(id) {
        if (confirm('⚠️ 本当にこの記録を履歴から削除してもよろしいですか？（この操作は取り消せません）')) {
            historyData = historyData.filter(item => item.id !== id);
            localStorage.setItem('pureLocalHistory', JSON.stringify(historyData));
            renderHistory();
            renderBests();
            updateAppStatus();
        }
    }

    function exportHistory() {
        if (historyData.length === 0) { alert('コピーする記録がまだないよ！👀'); return; }
        
        let exportText = "### 📋 筋トレ実践記録\n";
        exportText += `- **対象期間**: ${currentPeriodText}\n`;
        exportText += `- **経過日数**: 最初の記録から ${currentDiffDays} 日目\n\n`;
        
        exportText += "| 日付 | 時間 | 種目 | 回数 |\n";
        exportText += "| :--- | :--- | :--- | :--- |\n";
        
        historyData.forEach(item => {
            exportText += `| ${item.date} | ${item.time} | ${item.menu} | ${item.count}回 |\n`;
        });
        
        navigator.clipboard.writeText(exportText).then(() => {
            alert('見やすいテーブル形式でクリップボードにコピーしたよ！📋✨\nKeepへの保管や、AIへの分析依頼にそのまま使ってね！');
        }).catch(err => {
            alert('コピーに失敗しちゃいました💦');
        });
    }
</script>

</body>
</html>
