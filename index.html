<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#57ce77">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>筋トレ記録 - YUU Edition</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #2d3436; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 25px; }
        
        .label {
            font-size: 14px;
            color: #747d8c;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .selector-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .workout-selector {
            min-width: 0;
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccd1d9;
            font-weight: bold;
            background-color: #fff;
        }
        .btn-delete-menu {
            background-color: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .count-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 14px;
            border: 2px solid #2ed573;
            box-sizing: border-box;
            color: #2ed573;
        }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        button {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-save { background-color: #2ed573; color: white; font-size: 20px; padding: 16px; }
        .btn-export { background-color: #1e90ff; color: white; font-size: 16px; }
        
        .add-menu-box {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
        }
        .add-menu-input {
            min-width: 0;
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-new-menu { background-color: #a4b0be; color: white; padding: 10px 15px; font-size: 14px; border-radius: 8px; flex-shrink: 0; }

        .best-section {
            background: #fff9db;
            border: 1px solid #fab005;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .best-title {
            font-size: 15px;
            font-weight: bold;
            color: #f59f00;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .best-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }
        .best-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #fff3bf;
            display: flex;
            justify-content: space-between;
        }
        .best-name { color: #495057; font-weight: bold; }
        .best-val { color: #f59f00; font-weight: bold; }

        /* 💡 自己ベストの下に移動した期間＆日数カウンターのスタイル */
        .day-counter-box {
            background: #e3faf2;
            color: #0ca678;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .day-counter-title {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .day-counter-period {
            font-size: 12px;
            color: #37b24d;
            font-weight: normal;
        }

        .history-section {
            border-top: 2px solid #f1f2f6;
            padding-top: 20px;
        }
        .history-title {
            font-size: 18px;
            color: #2d3436;
            margin: 0 0 15px 0;
        }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
        }
        .history-item {
            padding: 12px 8px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item.is-today { background: #edfff2; border-left: 3px solid #37b24d; padding-left: 5px; border-radius: 8px; }
        .history-date { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .today-badge { display: inline-flex; padding: 2px 7px; border-radius: 999px; background: #168347; color: white; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .today-badge[hidden] { display: none; }
        .app-url-panel { background: #f4f8fb; border: 1px solid #dce6ed; border-radius: 12px; padding: 12px; margin: 12px 0; }
        .app-url-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .app-url-row input { flex: 1 1 170px; min-width: 0; padding: 10px; border: 1px solid #bfcbd6; border-radius: 8px; font-size: 13px; }
        .app-url-row button { flex: 0 0 auto; padding: 10px 12px; font-size: 14px; background: #1971c2; color: white; }
        #appUrlCopyStatus { font-size: 12px; margin: 6px 0 0; color: #1971c2; }
        .history-content { flex: 1; }
        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #747d8c;
            font-size: 12px;
            margin-bottom: 4px;
            padding-right: 15px;
        }
        .history-data {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            padding-right: 15px;
        }
        .menu-name { color: #2d3436; }
        .count-val { color: #84b91a; }
        .history-data span:last-child { color: #2ed573; }
        .btn-item-delete {
            background: none;
            color: #a4b0be;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-item-delete:hover { color: #ff4757; }

        .signature {
            margin-top: 20px;
            font-size: 11px;
            color: #b2bec3;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        [hidden] { display:none !important; }
        #cloudSection {margin-top:20px;border-top:1px solid #e3faf2;padding-top:12px;text-align:left;font-size:14px;line-height:1.6;}
        #cloudSection h2 {font-size:18px;}
        #dataSettings button, dialog button {margin:6px 2px;padding:10px 12px;background:#e3faf2;color:#174d32;font-size:13px;}
        #cloudSection input, dialog input {display:block;box-sizing:border-box;width:100%;min-width:0;padding:10px;border:1px solid #ccd6d0;border-radius:8px;margin:8px 0;font-size:16px;}
        #cloudSection p {overflow-wrap:anywhere;}
        .cloud-row {display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #edf2f7;}
        .cloud-row span {flex:1 1 140px;white-space:pre-line;overflow-wrap:anywhere;}
        .cloud-management {margin:16px 0;}
        dialog {max-width:calc(100vw - 48px);width:340px;border:0;border-radius:14px;}
    </style>
</head>
<body>

    </div>
