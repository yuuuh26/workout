<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレローカル記録 - YUU Edition</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #2d3436; text-align: center; margin-top: 0; font-size: 22px; }
        
        .label {
            font-size: 14px;
            color: #747d8c;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .selector-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .workout-selector {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccd1d9;
            font-weight: bold;
            background-color: #fff;
        }
        .btn-delete-menu {
            background-color: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .count-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 14px;
            border: 2px solid #2ed573;
            box-sizing: border-box;
            color: #2ed573;
        }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        button {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-save { background-color: #2ed573; color: white; font-size: 20px; padding: 16px; }
        .btn-export { background-color: #1e90ff; color: white; font-size: 16px; }
        
        .add-menu-box {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
        }
        .add-menu-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-new-menu { background-color: #a4b0be; color: white; padding: 10px 15px; font-size: 14px; border-radius: 8px; flex-shrink: 0; }

        .history-section {
            border-top: 2px solid #f1f2f6;
            padding-top: 20px;
        }
        .history-title {
            font-size: 18px;
            color: #2d3436;
            margin: 0 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
        }
        .history-item {
            padding: 12px 8px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-content { flex: 1; }
        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #747d8c;
            font-size: 12px;
            margin-bottom: 4px;
            padding-right: 15px;
        }
        .history-data {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            padding-right: 15px;
        }
        .menu-name { color: #2d3436; }
        .count-val { color: #2ed573; }
        .btn-item-delete {
            background: none;
            color: #a4b0be;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-item-delete:hover { color: #ff4757; }

        .signature {
            margin-top: 20px;
            font-size: 11px;
            color: #b2bec3;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 筋トレ記録 🔥</h1>
    
    <span class="label">種目の選択</span>
    <div class="selector-box">
        <select class="workout-selector" id="workoutSelect"></select>
        <button class="btn-delete-menu" onclick="deleteCurrentMenu()">消去 ❌</button>
    </div>

    <div class="input-box">
        <span class="label">行った回数を入力</span>
        <input type="number" class="count-input" id="countInput" inputmode="numeric" placeholder="0" min="1">
    </div>
    
    <div class="btn-grid">
        <button class="btn-save" onclick="saveRecord()">記録する 📝</button>
        <button class="btn-export" onclick="exportHistory()">クリップボードに全コピー 📋</button>
    </div>

    <div class="add-menu-box">
        <input type="text" class="add-menu-input" id="newMenuInput" placeholder="新しい種目名を入力...">
        <button class="btn-new-menu" onclick="addNewMenu()">種目を追加</button>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>📊 過去の筋トレ記録</span>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="signature">Created by YUU</div>
</div>

<script>
    const defaultMenus = ["逆手懸垂", "腕立て", "カーフレイズ", "スクワット"];
    let customMenus = JSON.parse(localStorage.getItem('pureLocalMenus')) || defaultMenus;
    let historyData = JSON.parse(localStorage.getItem('pureLocalHistory')) || [];

    initMenuSelect();
    renderHistory();

    function initMenuSelect() {
        const select = document.getElementById('workoutSelect');
        select.innerHTML = '';
        customMenus.forEach(menu => {
            const opt = document.createElement('option');
            opt.value = menu;
            opt.innerText = menu;
            select.appendChild(opt);
        });
    }

    function deleteCurrentMenu() {
        const select = document.getElementById('workoutSelect');
        const currentMenu = select.value;
        if (!currentMenu) return;

        if (confirm(`種目リストから「${currentMenu}」を削除しますか？`)) {
            customMenus = customMenus.filter(m => m !== currentMenu);
            localStorage.setItem('pureLocalMenus', JSON.stringify(customMenus));
            initMenuSelect();
        }
    }

    function addNewMenu() {
        const input = document.getElementById('newMenuInput');
        const menuName = input.value.trim();
        if (!menuName) return;
        if (customMenus.includes(menuName)) { alert('その種目はもうあるよ！👀'); return; }

        customMenus.push(menuName);
        localStorage.setItem('pureLocalMenus', JSON.stringify(customMenus));
        initMenuSelect();
        document.getElementById('workoutSelect').value = menuName;
        input.value = '';
    }

    function saveRecord() {
        const countInput = document.getElementById('countInput');
        const countVal = parseInt(countInput.value, 10);
        if (isNaN(countVal) || countVal <= 0) { return; }

        const selectedMenu = document.getElementById('workoutSelect').value;
        const now = new Date();
        const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const newRecord = { date: dateStr, time: timeStr, menu: selectedMenu, count: countVal, id: now.getTime() };

        // ローカルストレージに即時保存
        historyData.unshift(newRecord);
        localStorage.setItem('pureLocalHistory', JSON.stringify(historyData));
        
        // 確認画面なしで一瞬でリセット＆描画更新
        countInput.value = '';
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        if (historyData.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px;">まだ記録がありません。</div>';
            return;
        }
        historyData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-content">
                    <div class="history-meta"><span>📅 ${item.date}</span><span>⏰ ${item.time}</span></div>
                    <div class="history-data"><span class="menu-name">💪 ${item.menu}</span><span class="count-val">${item.count} 回</span></div>
                </div>
                <button class="btn-item-delete" onclick="deleteHistoryItem(${item.id})">🗑️</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteHistoryItem(id) {
        if (confirm('この記録を履歴から削除しますか？')) {
            historyData = historyData.filter(item => item.id !== id);
            localStorage.setItem('pureLocalHistory', JSON.stringify(historyData));
            renderHistory();
        }
    }

    function exportHistory() {
        if (historyData.length === 0) { alert('コピーする記録がまだないよ！👀'); return; }
        let exportText = "【筋トレ実践記録】\n\n";
        historyData.forEach(item => { exportText += `📅 ${item.date} ${item.time} | 💪 ${item.menu} : ${item.count}回\n`; });
        
        navigator.clipboard.writeText(exportText).then(() => {
            alert('クリップボードにコピーしたよ！📋\nKeepやAIにそのまま貼り付けてね✨');
        }).catch(err => {
            alert('コピーに失敗しちゃいました💦');
        });
    }
</script>

</body>
</html>
