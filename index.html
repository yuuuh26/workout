<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#57ce77">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>筋トレ記録 - YUU Edition</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h1 { color: #2d3436; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 25px; }
        
        .label {
            font-size: 14px;
            color: #747d8c;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .selector-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .workout-selector {
            min-width: 0;
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccd1d9;
            font-weight: bold;
            background-color: #fff;
        }
        .btn-delete-menu {
            background-color: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .count-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 14px;
            border: 2px solid #2ed573;
            box-sizing: border-box;
            color: #2ed573;
        }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        button {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-save { background-color: #2ed573; color: white; font-size: 20px; padding: 16px; }
        .btn-export { background-color: #1e90ff; color: white; font-size: 16px; }
        
        .add-menu-box {
            background: #f1f2f6;
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 8px;
        }
        .add-menu-input {
            min-width: 0;
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-new-menu { background-color: #a4b0be; color: white; padding: 10px 15px; font-size: 14px; border-radius: 8px; flex-shrink: 0; }

        .best-section {
            background: #fff9db;
            border: 1px solid #fab005;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .best-title {
            font-size: 15px;
            font-weight: bold;
            color: #f59f00;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .best-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }
        .best-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #fff3bf;
            display: flex;
            justify-content: space-between;
        }
        .best-name { color: #495057; font-weight: bold; }
        .best-val { color: #f59f00; font-weight: bold; }

        /* 💡 自己ベストの下に移動した期間＆日数カウンターのスタイル */
        .day-counter-box {
            background: #e3faf2;
            color: #0ca678;
            padding: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .day-counter-title {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .day-counter-period {
            font-size: 12px;
            color: #37b24d;
            font-weight: normal;
        }

        .history-section {
            border-top: 2px solid #f1f2f6;
            padding-top: 20px;
        }
        .history-title {
            font-size: 18px;
            color: #2d3436;
            margin: 0 0 15px 0;
        }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            border-radius: 12px;
            background: #f8f9fa;
            padding: 10px;
        }
        .history-item {
            padding: 12px 8px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-content { flex: 1; }
        .history-meta {
            display: flex;
            justify-content: space-between;
            color: #747d8c;
            font-size: 12px;
            margin-bottom: 4px;
            padding-right: 15px;
        }
        .history-data {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            padding-right: 15px;
        }
        .menu-name { color: #2d3436; }
        .count-val { color: #2ed573; }
        .btn-item-delete {
            background: none;
            color: #a4b0be;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-item-delete:hover { color: #ff4757; }

        .signature {
            margin-top: 20px;
            font-size: 11px;
            color: #b2bec3;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 筋トレ記録 🔥</h1>
    
    <!-- 💡 最上部にきて、すぐ入力できるよう配置変更！ -->
    <span class="label">種目の選択</span>
    <div class="selector-box">
        <select class="workout-selector" id="workoutSelect"></select>
        <button class="btn-delete-menu" onclick="deleteCurrentMenu()">消去 ❌</button>
    </div>

    <div class="input-box">
        <span class="label">行った回数を入力</span>
        <input type="number" class="count-input" id="countInput" inputmode="numeric" placeholder="0" min="1">
    </div>
    
    <details id="dateDetails" style="margin-bottom:16px">
        <summary>日時を変更</summary>
        <label class="label" for="recordDate">実際に筋トレした日時</label>
        <input id="recordDate" type="datetime-local" style="padding:10px;max-width:100%;box-sizing:border-box">
        <button type="button" id="resetDate">現在日時に戻す</button>
    </details>
    <div class="btn-grid">
        <button class="btn-save" onclick="saveRecord()">記録する 📝</button>
        <button class="btn-export" onclick="exportHistory()">クリップボードに全コピー 📋</button>
        <button class="btn-export" onclick="exportMarkdown()">Markdownファイルを保存 📄</button>
    </div>

    <div class="add-menu-box">
        <input type="text" class="add-menu-input" id="newMenuInput" placeholder="新しい種目名を入力...">
        <button class="btn-new-menu" onclick="addNewMenu()">種目を追加</button>
    </div>

    <div class="best-section">
        <div class="best-title">🏆 自己ベスト（最高回数）</div>
        <div class="best-grid" id="bestGrid"></div>
    </div>

    <!-- 💡 ご要望通り、自己ベストの下の欄に移動！ -->
    <div class="day-counter-box" id="dayCounterBox">
        <div class="day-counter-title" id="dayCounterDisplay">現在の保存日数: 0 日間</div>
        <div class="day-counter-period" id="periodDisplay">記録がありません</div>
    </div>

    <div class="history-section">
        <div class="history-title">
            <span>📊 過去の筋トレ記録</span>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <details style="margin-top:20px" id="dataSettings">
        <summary>データ管理</summary>
        <p id="storageStatus" role="status"></p>
        <p id="persistentStatus"></p>
        <button onclick="downloadBackup()">JSONバックアップを保存</button>
        <p><label>JSONから復元 <input id="restoreFile" type="file" accept=".json,application/json"></label></p>
        <button onclick="requestPersistence()">保存の保護を申請</button>
        <p style="font-size:12px">保護が許可されても、ブラウザデータの削除・端末故障には備えられません。JSONバックアップを保管してください。</p>
    </details>
    <section id="migrationPanel" hidden style="margin-top:16px;background:#e3faf2;padding:12px;border-radius:12px">
        <strong>記録の保存方式を更新できます</strong>
        <p>まずJSONバックアップを保存し、ダウンロードしたファイルを確認してください。元データを残して移行します。</p>
        <button onclick="downloadBackup(true)">① 移行前バックアップを保存</button>
        <button id="migrateButton" onclick="migrateStorage()" disabled>② 保存したので移行する</button>
    </section>
    <div id="appMessage" role="status" style="margin-top:12px"></div>
    <div class="signature">Created by YUU</div>
</div>

<script src="./app.js"></script>
</body>
</html>
